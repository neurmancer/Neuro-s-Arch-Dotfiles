# NSD includes its colors directly so it works before theme files are installed.

draw-bold-text-with-light-colors = true

line-height = 1.18

margin = [14, 18, 10, 18]

scrollback-history-limit = 20000
confirm-before-quit = true
copy-on-select = false
hide-mouse-cursor-when-typing = true


[colors]
background = "#070912"
foreground = "#E1E8FA"
black = "#070912"
red = "#C170FF"
green = "#00EB74"
yellow = "#B4EE7D"
blue = "#5A96FF"
magenta = "#C170FF"
cyan = "#6ABFEF"
white = "#E1E8FA"
light-black = "#3E3F46"
light-red = "#CF8FFF"
light-green = "#38EF93"
light-yellow = "#C4F29A"
light-blue = "#7EADFF"
light-magenta = "#CF8FFF"
light-cyan = "#8BCDF3"
light-white = "#E8EDFB"
light-foreground = "#F0F4FF"
dim-black = "#04050A"
dim-red = "#6A3E8C"
dim-green = "#008140"
dim-yellow = "#638345"
dim-blue = "#32528C"
dim-magenta = "#6A3E8C"
dim-cyan = "#3A6983"
dim-white = "#7C808A"
dim-foreground = "#929AB4"
cursor = "#00EB74"
vi-cursor = "#C170FF"
tabs = "#0C101C"
tabs-active = "#C170FF"
tab-border = "#00EB74"
bar = "#070912"
split = "#263350"
split-active = "#C170FF"
selection-background = "#3A2854"
selection-foreground = "#F0F4FF"
search-match-background = "#C170FF"
search-match-foreground = "#070912"
search-focused-match-background = "#00EB74"
search-focused-match-foreground = "#070912"
hint-background = "#C170FF"
hint-foreground = "#070912"

[window]
opacity = 0.97
opacity-cells = true
blur = true
decorations = "Enabled"

[fonts]
family = "JetBrains Mono"
size = 15
use-drawable-chars = true
hinting = true
features = ["calt", "liga"]
disable-warnings-not-found = false



symbol-map = [
  { start = "23FB", end = "23FF", "font-family" = "Symbols Nerd Font Mono" },
  { start = "E000", end = "E00B", "font-family" = "Symbols Nerd Font Mono" },
  { start = "E0A0", end = "E0A4", "font-family" = "Symbols Nerd Font Mono" },
  { start = "E0B0", end = "E0D8", "font-family" = "Symbols Nerd Font Mono" },
  { start = "E200", end = "E2AA", "font-family" = "Symbols Nerd Font Mono" },
  { start = "E300", end = "E3E4", "font-family" = "Symbols Nerd Font Mono" },
  { start = "E5FA", end = "E6B8", "font-family" = "Symbols Nerd Font Mono" },
  { start = "E700", end = "E8F0", "font-family" = "Symbols Nerd Font Mono" },
  { start = "EA60", end = "EC1F", "font-family" = "Symbols Nerd Font Mono" },
  { start = "ED00", end = "EFCF", "font-family" = "Symbols Nerd Font Mono" },
  { start = "F300", end = "F382", "font-family" = "Symbols Nerd Font Mono" },
  { start = "F400", end = "F534", "font-family" = "Symbols Nerd Font Mono" },
  { start = "F0001", end = "F1AF1", "font-family" = "Symbols Nerd Font Mono" },
  { start = "21D0", end = "21FF", "font-family" = "DejaVu Sans" },
  { start = "1F300", end = "1FAFF", "font-family" = "Noto Color Emoji" },

  { start = "2600", end = "26A1", "font-family" = "DejaVu Sans" },
  { start = "26A2", end = "276C", "font-family" = "DejaVu Sans" },
  { start = "2772", end = "27C0", "font-family" = "DejaVu Sans" },
]

[cursor]
shape = "block"
blinking = true
blinking-interval = 600

[effects]
trail-cursor = true
custom-mouse-cursor = false
trail-cursor-color = "#00EB74"

[navigation]
mode = "Tab"
hide-if-single = true
use-split = true
current-working-directory = true
unfocused-split-opacity = 0.55
enable-scroll-bar = true


[[navigation.color-automation]]
program = "nvim"
color = "#C170FF"

[[navigation.color-automation]]
program = "vim"
color = "#C170FF"

[[navigation.color-automation]]
program = "ssh"
color = "#C170FF"

[[navigation.color-automation]]
program = "sudo"
color = "#C170FF"

[[navigation.color-automation]]
program = "btop"
color = "#00EB74"

[panel]
padding = [14, 6]
border-width = 1
border-radius = 6
row-gap = 4
column-gap = 4

[title]
content = "{{ title || program }}"
placeholder = "▮ rio"

[bell]
audio = true

[renderer]
backend = "Webgpu"
filters = ["__RIO_SHADERS__/newpixie-flat/newpixie-crt.slangp"]
strategy = "events"
disable-unfocused-render = false
